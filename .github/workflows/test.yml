name: Test

# The tests of the repository: the PR check and the pre-release run them (workflow_call).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned tools (mise.toml)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: mise run install
      - name: Design system copy
        run: mise run check:ds
      - name: Lint
        run: mise run lint
      - name: Typecheck
        run: mise run typecheck
      - name: Test
        run: mise run test
      - name: Optional settings survive the image build
        # Builds the export the way deploy/Dockerfile does (placeholders) and checks the placeholders, the substitution and an empty build.
        run: mise run check:cfg
