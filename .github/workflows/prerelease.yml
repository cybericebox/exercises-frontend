name: Pre-release

# A push to main (the merge of develop) publishes vX.Y.Z-rc.N and creates the GitHub pre-release. The rc image is a retag of
# the develop image sha-<7> (no build) when the main tree equals the tree of the develop head; otherwise it is built.
# The version comes from the last release tag: patch by default, minor when a PR merged since the last release has the
# "minor" label, major only through a manual run. Nothing is published when the tree is unchanged since the last rc.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      major:
        description: Bump the major version
        type: boolean
        default: false
      version:
        description: Exact version X.Y.Z (above the last release); overrides the computed one
        required: false
        default: ''

concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.v.outputs.skip }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Next version
        id: v
        env:
          BUMP: ${{ inputs.major && 'major' || 'auto' }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci.sh next-version

  test:
    name: Test
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/test.yml

  source:
    name: Image source
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      IMAGES: cybericebox/exercises-frontend
    outputs:
      mode: ${{ steps.s.outputs.mode }}
      tag: ${{ steps.s.outputs.tag }}
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag or build
        id: s
        run: |
          # shellcheck disable=SC2086
          out=$(.github/scripts/ci.sh rc-source $IMAGES)
          mode=${out%% *}
          mode=${mode%:}
          echo "pre-release image: $out"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ "$mode" == retag ]]; then echo "tag=${out#* }" >> "$GITHUB_OUTPUT"; fi

  image:
    name: Image ${{ matrix.name }}
    needs: [version, test, source]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exercises-frontend
            image: cybericebox/exercises-frontend
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        if: needs.source.outputs.mode != 'retag'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Retag the develop image (no build)
        if: needs.source.outputs.mode == 'retag'
        env:
          IMAGE: ${{ matrix.image }}
          SRC: ${{ needs.source.outputs.tag }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          echo "retag $IMAGE:$SRC -> $IMAGE:$TAG"
          .github/scripts/ci.sh retry docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$SRC"
      - name: Build and push the image
        if: needs.source.outputs.mode != 'retag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-develop
          tags: ${{ matrix.image }}:${{ needs.version.outputs.tag }}

  release:
    name: GitHub pre-release
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" --generate-notes
