name: Deploy exercises to GitHub Pages

# Static export (out/) → GitHub Pages. Runs only from promote.yml, after the pre-release checks, for the release commit.
# Custom domain is set in Settings → Pages (Actions deployments ignore a CNAME file).
# The hosts are baked at build: NEXT_PUBLIC_DOMAIN derives every host that is not set, a host variable (vars.*) that is set wins.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit of the release to build
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Build reads the github-pages environment's variables and secrets too, so the
    # Pages configuration lives in one place (Settings → Environments → github-pages).
    environment: github-pages
    steps:
      - name: Check repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve the hosts and check the variables
        # NEXT_PUBLIC_DOMAIN derives every host that is not set (deploy/base-domain.sh, the same file the image runs); a host variable that is
        # set wins. The resolved hosts go to the build through GITHUB_ENV. The other values are per site and have no fallbacks.
        run: |
          . ./deploy/base-domain.sh
          base_domain_derive || { echo "::error::Set the repository variable NEXT_PUBLIC_DOMAIN (or every host variable)"; exit 1; }
          for name in NEXT_PUBLIC_MAIN_HOST NEXT_PUBLIC_API_HOST NEXT_PUBLIC_ID_HOST NEXT_PUBLIC_ADMIN_HOST NEXT_PUBLIC_EXERCISES_HOST NEXT_PUBLIC_EVENT_DOMAIN NEXT_PUBLIC_COOKIE_DOMAIN; do
            eval "value=\"\${$name}\""
            printf '%s=%s\n' "$name" "$value"
          done >> "$GITHUB_ENV"
          missing=""
          for name in NEXT_PUBLIC_SUPPORT_EMAIL; do
            eval "value=\"\${$name:-}\""
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "::error::Set the repository variables:$missing"; exit 1; fi
        env:
          NEXT_PUBLIC_DOMAIN: ${{ vars.NEXT_PUBLIC_DOMAIN }}
          NEXT_PUBLIC_MAIN_HOST: ${{ vars.NEXT_PUBLIC_MAIN_HOST }}
          NEXT_PUBLIC_API_HOST: ${{ vars.NEXT_PUBLIC_API_HOST }}
          NEXT_PUBLIC_ID_HOST: ${{ vars.NEXT_PUBLIC_ID_HOST }}
          NEXT_PUBLIC_ADMIN_HOST: ${{ vars.NEXT_PUBLIC_ADMIN_HOST }}
          NEXT_PUBLIC_EXERCISES_HOST: ${{ vars.NEXT_PUBLIC_EXERCISES_HOST }}
          NEXT_PUBLIC_EVENT_DOMAIN: ${{ vars.NEXT_PUBLIC_EVENT_DOMAIN }}
          NEXT_PUBLIC_COOKIE_DOMAIN: ${{ vars.NEXT_PUBLIC_COOKIE_DOMAIN }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
      - name: Build static export
        run: npm run build
        env:
          # the hosts are in GITHUB_ENV (resolved above); the per-site values are repository / environment variables
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
