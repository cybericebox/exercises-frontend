name: Deploy exercises to GitHub Pages

# Static export (out/) → GitHub Pages. Runs on every published release (same as publish-image.yml) and on demand.
# Custom domain is set in Settings → Pages (Actions deployments ignore a CNAME file).
# The app needs the API at runtime (api.<domain> or NEXT_PUBLIC_API_DOMAIN).
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Build reads the github-pages environment's variables and secrets too, so the
    # Pages configuration lives in one place (Settings → Environments → github-pages).
    environment: github-pages
    steps:
      - name: Check repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
        env:
          # repository variables; domain defaults to the production apex
          NEXT_PUBLIC_DOMAIN: ${{ vars.NEXT_PUBLIC_DOMAIN || 'cybericebox.com' }}
          # optional host overrides (bare host, no scheme); empty → <service>.<domain>
          NEXT_PUBLIC_API_DOMAIN: ${{ vars.NEXT_PUBLIC_API_DOMAIN }}
          NEXT_PUBLIC_ID_DOMAIN: ${{ vars.NEXT_PUBLIC_ID_DOMAIN }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
