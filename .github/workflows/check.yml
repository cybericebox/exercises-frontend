name: Check

# A PR into develop or main: tests plus the image build. Nothing is published and nothing is written to a registry: a check runs
# the code of the pull request, so it holds no Docker Hub credential (a token in the runner could be read by that code). It reads the
# layer cache that only the release builds write (<image>:buildcache-release, public).
on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A PR with only docs (*.md, docs/**, .gitignore, LICENSE) builds nothing. A release PR into main always runs everything.
      # This is a job, not a paths-ignore on the workflow: the required check "Check passed" must always report.
      - name: Is there more than docs
        id: c
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=false
          if [[ "$BASE_REF" == main ]] || ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            code=true
          else
            while IFS= read -r f; do
              case "$f" in
                '' | *.md | docs/* | .gitignore | LICENSE) ;;
                *) code=true ;;
              esac
            done <<<"$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test.yml

  image:
    name: Image ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exercises-frontend
            image: cybericebox/exercises-frontend
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-release

  container:
    name: Container tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image and test the nginx contract (listeners, TLS, trailing slash)
        run: bash scripts/test-nginx-tls.sh

  passed:
    name: Check passed
    if: ${{ always() }}
    needs: [changes, test, image, container]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
