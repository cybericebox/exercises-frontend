# Main nginx config (replaces the stock /etc/nginx/nginx.conf), the same file in every static frontend image.
# Runs as user nginx (101) on a read-only root: pid under /run, temp files under /var/cache/nginx, and everything the
# entrypoint generates (CSP, origin TLS listen block, health server) under /tmp/nginx-gen.
user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    # Generated at container start: CSP map (deploy/csp.sh) and, with ORIGIN_TLS=true, the plain health server.
    include /tmp/nginx-gen/http.d/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
