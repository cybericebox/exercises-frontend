apiVersion: v1
kind: ConfigMap
metadata:
  name: exercises-frontend-config
  namespace: cybericebox
data:
  # Hosts (bare host, no scheme). All required: set them from the platform env (see docs/specs/configuration.md).
  # Left empty here on purpose; the container refuses to start while one is empty.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  EVENT_DOMAIN: ""
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
