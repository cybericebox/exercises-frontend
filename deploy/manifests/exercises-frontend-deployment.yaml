apiVersion: apps/v1
kind: Deployment
metadata:
  name: exercises-frontend
  namespace: cybericebox
  labels:
    app: exercises-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: exercises-frontend
  template:
    metadata:
      name: exercises-frontend
      namespace: cybericebox
      labels:
        app: exercises-frontend
    spec:
      containers:
        - name: exercises-frontend
          image: cybericebox/exercises-frontend:v0.1.0 # the release tag: an exact version, never latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_MAIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: MAIN_HOST
            - name: NEXT_PUBLIC_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: API_HOST
            - name: NEXT_PUBLIC_ID_HOST
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: ID_HOST
            - name: NEXT_PUBLIC_ADMIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: ADMIN_HOST
            - name: NEXT_PUBLIC_EXERCISES_HOST
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: EXERCISES_HOST
            - name: NEXT_PUBLIC_EVENT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: EVENT_DOMAIN
            - name: NEXT_PUBLIC_COOKIE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: COOKIE_DOMAIN
            - name: NEXT_PUBLIC_SUPPORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: SUPPORT_EMAIL
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: GOOGLE_ANALYTICS_ID
            - name: NEXT_PUBLIC_CAPTCHA_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: CAPTCHA_PROVIDER
            - name: NEXT_PUBLIC_CAPTCHA_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: CAPTCHA_SITE_KEY
            - name: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: RECAPTCHA_ENTERPRISE
            - name: NEXT_PUBLIC_DOS_PROTECTION
              valueFrom:
                configMapKeyRef:
                  name: exercises-frontend-config
                  key: DOS_PROTECTION
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
            periodSeconds: 30
