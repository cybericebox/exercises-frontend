# Client certificate validation (mutual TLS). Rendered into /tmp/nginx-gen by deploy/nginx-entrypoint.sh; an empty file
# when TLS_CLIENT_AUTH is off. TLS_VERIFY_CLIENT is "on" for TLS_CLIENT_AUTH=require and "optional" for optional
# (then $ssl_client_verify holds the result: SUCCESS, NONE or FAILED:<reason>).
ssl_client_certificate ${TLS_CLIENT_CA_FILE};
ssl_verify_client ${TLS_VERIFY_CLIENT};
ssl_verify_depth 4;

# nginx would answer a missing (496) or invalid (495) certificate with a 400 page; drop the connection instead.
error_page 495 496 = @tls_client_refused;
location @tls_client_refused {
    return 444;
}
