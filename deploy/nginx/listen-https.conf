# TLS listener (HTTP/2). Rendered into /tmp/nginx-gen by deploy/nginx-entrypoint.sh; an empty file unless
# TLS_CERT_FILE and TLS_KEY_FILE are set. TLS_PROTOCOLS is derived from TLS_MIN_VERSION.
listen ${HTTPS_PORT} ssl;
http2 on;
ssl_certificate     ${TLS_CERT_FILE};
ssl_certificate_key ${TLS_KEY_FILE};
ssl_protocols ${TLS_PROTOCOLS};
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:tls:10m;
ssl_session_tickets off;
