# Plain-HTTP health server for kubelet probes (it cannot present a client certificate): only the health path, nothing
# else. Rendered into /tmp/nginx-gen by deploy/nginx-entrypoint.sh; an empty file when HEALTH_PORT is empty.
server {
    listen ${HEALTH_BIND}:${HEALTH_PORT};
    server_name _;
    root /usr/share/nginx/html;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
