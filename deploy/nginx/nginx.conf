# Main nginx config (replaces the stock /etc/nginx/nginx.conf), the same file in every nginx-based frontend image.
# Runs as user nginx (101) on a read-only root: pid under /run, temp files under /var/cache/nginx, and everything the
# entrypoint generates (CSP, the rendered snippets) under /tmp/nginx-gen.
user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    # Generated at container start: the CSP map (deploy/csp.sh).
    include /tmp/nginx-gen/http.d/*.conf;
    # The plain health server; an empty file unless HEALTH_PORT is set (deploy/nginx-entrypoint.sh).
    include /tmp/nginx-gen/health.conf;
    include /etc/nginx/server.conf;
}
