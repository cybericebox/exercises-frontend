# A path ending in a slash is the same page without it: a permanent redirect (308 keeps the method), query string kept.
# The export has both x.html and an x/ directory for nested routes, so serving "/x/" as a directory would be a 403.
# The Location is relative (absolute_redirect off), so the scheme and host the client used stay as they were behind the TLS edge.
# Leading slashes collapse to one and a leading backslash never matches, so the target can not become //host (an open redirect).
map $request_uri $without_trailing_slash {
    default "";
    "~^/+(?<slash_rest>[^?/\x5c](?:[^?]*[^/?])?)/+(?<slash_query>\?.*)?$" /$slash_rest$slash_query;
}

server {
    absolute_redirect off;
    # Listeners and client auth: snippets rendered at container start by deploy/nginx-entrypoint.sh (empty when off).
    include /tmp/nginx-gen/listen-http.conf;
    include /tmp/nginx-gen/listen-https.conf;
    include /tmp/nginx-gen/client-auth.conf;
    server_name _;
    root /usr/share/nginx/html;

    # Content-Security-Policy, generated at container start by deploy/csp.sh. A location that sets its
    # own add_header does not inherit the server-level ones, so it must include this file again.
    include /tmp/nginx-gen/csp.conf;

    if ($without_trailing_slash) {
        return 308 $without_trailing_slash;
    }

    # Static export: pages live at /<path>.html, nested routes also have a /<path>/ directory (never listed, never a 403).
    # Resolve /x → /x.html → /x/index.html → the app's 404 page.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    error_page 404 /404.html;
}
